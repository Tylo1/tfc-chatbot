<!DOCTYPE html>
<html>
<head>
    <title>TFC Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f0f10 url("background.jpeg") no-repeat center center fixed;
            background-size: cover;
            background-blend-mode: overlay;
            background-color: rgba(0,0,0,0.45);
            color: #fdf3e7;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
            padding-right: 12%;
        }

        .login-box {
            background: linear-gradient(160deg, #5c1313, #2e0808);
            border: 3px solid #f97316;
            border-radius: 14px;
            padding: 44px 40px;
            width: min(440px, 90vw);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(249, 115, 22, 0.15);
            animation: rise 0.4s ease-out;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Anton', Arial, sans-serif;
            font-size: 28px;
            letter-spacing: 1px;
            text-align: center;
            margin: 0 0 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .accent-bar {
            width: 48px;
            height: 4px;
            background: #fbbf24;
            margin: 0 auto 24px;
            border-radius: 2px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: box-shadow 0.2s ease;
        }

            input:focus {
                box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.5);
            }

        button {
            width: 100%;
            padding: 11px;
            background: #fbbf24;
            color: #2e0808;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

            button:hover {
                background: #f59e0b;
            }

            button:active {
                transform: scale(0.98);
            }

        p {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }

        a {
            color: #fbbf24;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>TFC Register</h1>
        <div class="accent-bar"></div>
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="username" placeholder="Username">
        <div style="position: relative;">
            <input type="password" id="password" placeholder="Password" style="margin-bottom:15px;">
            <span onclick="togglePassword('password')" style="position:absolute; right:12px; top:50%; transform:translateY(-80%); cursor:pointer; color:#888;">👁</span>
        </div>

        <button onclick="register()">Register</button>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }
        let pendingUsername = null;

        async function register() {
            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const response = await fetch("/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();

            if (response.ok && data.verifyPending) {
                pendingUsername = data.username;
                document.querySelector(".login-box").innerHTML = `
                    <h1>Verify Email</h1>
                    <div class="accent-bar"></div>
                    <p>We sent a 6-digit code to your email. Enter it below to complete registration.</p>
                    <input type="text" id="code" placeholder="6-digit code" maxlength="6">
                    <button onclick="verifyCode()">Verify</button>
                `;
            } else if (!response.ok) {
                alert(data.message);
            }
        }


        async function verifyCode() {
            const code = document.getElementById("code").value;

            const response = await fetch("/api/auth/verify-login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: pendingUsername, code })
            });

            const data = await response.json();

            if (response.ok) {
                alert("Email verified! You can now log in.");
                window.location.href = "/login.html";
            } else {
                alert(data.message);
            }
        }
    </script>

</body>
</html>
